app:
  name: personal-ai-memory
  environment: development

paths:
  vault_root: ./vault
  inbox_root: ./data/inbox
  staging_root: ./data/staging
  manifest_root: ./data/manifests
  cache_root: ./data/cache
  log_root: ./data/logs

ollama:
  host: http://localhost:11434
  model: qwen3:8b
  timeout_seconds: 1800
  request_retries: 3
  retry_backoff_seconds: 1.0

logging:
  level: INFO
  format: console
  console_enabled: true
  file_enabled: true
  use_colors: true
  filename: application.log
  max_bytes: 10485760
  backup_count: 5

watcher:
  enabled: true
  inbox_path: ./data/inbox
  processed_path: ./data/processed
  failed_path: ./data/failed
  recursive: true
  interval_seconds: 1
  supported_extensions:
    # Documents
    - .txt
    - .md
    - .pdf
    - .csv
    - .xlsx
    # Programming
    - .py
    - .js
    - .ts
    - .jsx
    - .tsx
    - .java
    - .c
    - .cpp
    - .cs
    - .go
    - .rb
    - .rs
    - .php
    - .sh
    - .bash
    - .kt
    - .swift
    - .dart
    - .scala
    - .r
    - .m
    - .ps1
    - .sql
    - .css
    - .scss
    - .less
    - .vue
    - .svelte
    # Images
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .webp
    - .bmp
    - .tiff
    - .heic
    - .svg
    # Audio
    - .mp3
    - .wav
    - .m4a
    - .flac
    - .ogg
    - .aac
    # Video
    - .mp4
    - .mkv
    - .mov
    - .avi
    - .webm

queue:
  enabled: true
  workers: 1
  max_size: 1000
  state_path: ./data/manifests/queue_state.json

manifest:
  enabled: true
  path: ./data/manifests/processed_files.json

processing:
  move_processed: true
  move_failed: true
  processed_path: ./data/processed
  failed_path: ./data/failed

models:
  general_text: qwen3:8b
  programming: qwen2.5-coder:7b
  vision: qwen2.5vl:latest
  handwriting_ocr: qwen2.5vl:latest
  scanned_ocr: qwen2.5vl:latest
  audio: faster-whisper
  embeddings: nomic-embed-text

intelligence:
  ocr:
    enabled: true
    engine: "auto"
    page_limit: 5
    zoom: 2.0
    preprocess: false
    tesseract_cmd: ""
    tesseract_lang: "eng"
    confidence_threshold: 0.0
    max_pages: 200
  prompts:
    ocr: "This is a scanned PDF page. Extract all visible text accurately. Return only the extracted text, nothing else."
    handwriting: "This is a handwritten document. Transcribe all handwritten text as accurately as possible. Return only the transcribed text, nothing else."
    vision: "Analyze this image. If it contains handwritten text, transcribe all handwritten text accurately. If it contains printed text or digital content, extract all visible text. Return only the extracted text, nothing else."
  metadata:
    enabled: true
    extractors: "default"
    mime_enabled: true
    language_detection_enabled: true
    max_file_size_mb: 50
    url_timeout_seconds: 30
    email_attachments: true
    max_attachments: 20
    hooks:
      pre: []
      post: []
  structure:
    enabled: true                 # false ⇒ no "structure" key; M2.2-identical documents (R-4)
    enrich_analysis_input: false  # addendum 3; CONTRACT-ONLY this milestone (C-5) - no code reads it (R-7)
  entities:
    enabled: true                 # false ⇒ no "entities" key; M2.2-identical documents (R-4)
  relationships:
    enabled: true                 # false ⇒ no "relationships" key (R-4)
  graph:
    enabled: true                 # false ⇒ no "knowledge_graph" key (R-4)
  tables:
    enabled: true                 # false ⇒ no "tables" key; Phase-1-identical notes (R-4)
    pdf_engine: "pdfplumber"      # default engine (ADR-002); "camelot" = optional plugin w/ fallback
    max_rows: 200                 # frozen §2.4 row cap
    max_cols: 30                  # frozen §2.4 column cap
    header_sniffing: true         # first row treated as header
  images:
    preprocess: false             # global image preprocessing toggle (R-a); ocr.preprocess stays separate
    exif_enabled: true            # false => no image_info key; Phase-1-identical documents (R-4)
    diagram_enabled: true         # false => .drawio raw text passthrough (R-4)
    max_dimensions: [8192, 8192]  # frozen §4.5 [8192, 8192]; supersedes historical MAX_EDGE constant (P2-503)
    max_bytes: 20971520           # 20 MiB preprocessing cap (frozen §4.5)
  code:
    enabled: true                 # false ⇒ no code_structure/notebook_structure keys; Phase-1 passthrough (R-4)
    languages: "default"          # built-in extensions.py suffix→language map; other values deferred (frozen §4.6)
    max_cell_outputs: 10          # notebook cell outputs capped during NotebookParser.parse() (frozen §4.6)
    max_code_chars: 100000        # str-length cap; oversized code truncated with logged warning (frozen §4.6)
    include_docstrings: true      # contract-only this milestone (C-5) - no code reads it

reranker:
  enabled: false
  model: "cross-encoder/ms-marco-MiniLM-L-12-v2"
  top_n: 20
  device: "cpu"
  timeout_seconds: 5.0
  min_score: 0.0

chunking:
  sentence_tokenizer: "auto"     # auto ⇒ nltk when available, stdlib heuristic fallback; "heuristic" ⇒ deterministic stdlib; "nltk" ⇒ force nltk
  heading_size_step: 0           # P3-205: shrink chunk budget by this many chars per heading level below 1 (0 ⇒ fixed sizing)
  min_chunk_chars: 200           # P3-205: floor for the dynamic budget
  snap_overlap: false            # P3-205: snap overlap tails to paragraph/list-item boundaries
  snap_max_back: 2000            # P3-205: max chars the overlap snap may walk back
  heading_overlap_boundary: false  # P3-205: never prepend overlap into a chunk that begins with a heading
