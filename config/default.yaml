app:
  name: personal-ai-memory
  environment: development

paths:
  vault_root: ./vault
  inbox_root: ./data/inbox
  staging_root: ./data/staging
  manifest_root: ./data/manifests
  cache_root: ./data/cache
  log_root: ./data/logs

ollama:
  host: http://localhost:11434
  model: qwen3:8b
  timeout_seconds: 900
  request_retries: 3
  retry_backoff_seconds: 1.0

logging:
  level: INFO
  format: console
  console_enabled: true
  file_enabled: true
  use_colors: true
  filename: application.log
  max_bytes: 10485760
  backup_count: 5

watcher:
  enabled: true
  inbox_path: ./data/inbox
  processed_path: ./data/processed
  failed_path: ./data/failed
  recursive: true
  interval_seconds: 1
  supported_extensions:
    # Documents
    - .txt
    - .md
    - .markdown
    - .rtf
    - .docx
    - .odt
    - .pdf
    - .tex
    - .epub
    # Programming
    - .py
    - .js
    - .ts
    - .jsx
    - .tsx
    - .java
    - .c
    - .cpp
    - .cs
    - .go
    - .rb
    - .rs
    - .php
    - .sh
    - .bash
    - .kt
    - .swift
    - .dart
    - .scala
    - .r
    - .m
    - .ps1
    - .sql
    - .css
    - .scss
    - .less
    - .vue
    - .svelte
    - .toml
    - .ini
    - .cfg
    - .conf
    - .env
    # Notebooks
    - .ipynb
    # Spreadsheets
    - .csv
    - .tsv
    - .xls
    - .xlsx
    - .ods
    # Presentations
    - .pptx
    - .ppt
    - .odp
    # Images
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .webp
    - .bmp
    - .tiff
    - .heic
    - .svg
    # Diagrams
    - .drawio
    - .mmd
    # Audio
    - .mp3
    - .wav
    - .m4a
    - .aac
    - .ogg
    - .flac
    # Video
    - .mp4
    - .mkv
    - .mov
    - .avi
    - .webm
    # Archives
    - .zip
    - .tar
    - .gz
    - .7z
    - .rar
    # Email
    - .eml
    # Databases
    - .sqlite
    - .db
    # Research
    - .bib
    - .ris
    # Config
    - .yaml
    - .yml
    # Web
    - .html
    - .htm
    - .xml
    - .json
    - .rss

queue:
  enabled: true
  workers: 1
  max_size: 1000
  state_path: ./data/manifests/queue_state.json

manifest:
  enabled: true
  path: ./data/manifests/processed_files.json

processing:
  move_processed: true
  move_failed: true
  processed_path: ./data/processed
  failed_path: ./data/failed

models:
  general_text: qwen3:8b
  programming: qwen2.5-coder:7b
  vision: qwen2.5vl:latest
  handwriting_ocr: qwen2.5vl:latest
  scanned_ocr: qwen2.5vl:latest
  audio: faster-whisper
  embeddings: nomic-embed-text
