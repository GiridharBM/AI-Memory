[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-memory"
version = "1.1.0"
description = "Local-first Personal AI Memory System for building an Obsidian knowledge wiki with Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "GiridharBM",email="giridharbm6868@gmail.com" }
]
dependencies = [
  "ollama>=0.4.7",
  "pypdf>=4.3.1",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "PyYAML>=6.0.2",
  "rich>=13.7.1",
  "python-docx>=1.1.0",
  "python-pptx>=0.6.23",
  "typer>=0.12.3",
  "watchdog>=4.0.2",
  "youtube-transcript-api>=0.6.2",
  "PyMuPDF>=1.24.0",
  "openpyxl>=3.1.0",
  "faster-whisper>=1.0.0",
  "odfpy>=1.4.0",
  "striprtf>=0.0.26",
  "xlrd>=2.0.0",
  "olefile>=0.47"
]

[project.optional-dependencies]
intelligence = [
  "pytesseract>=0.3.10",
  "Pillow>=10.0.0",
  "numpy>=1.26.0",
  "python-magic>=0.4.27",
  "py3langid>=0.2.0",
  "pdfplumber>=0.11.0",
  "nltk>=3.9"
]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy==2.3.0",
  "types-PyYAML>=6.0.12",
  "xlwt>=1.3.0"
]

[project.scripts]
pam = "app.cli.entry:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --tb=short -m 'not integration'"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
# numpy's current stubs use PEP 695 syntax (Python 3.12+); check against 3.12
# so they parse across the CI matrix (3.11-3.13). App requires-python >=3.11.
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
  "pptx",
  "docx",
  "faster_whisper",
  "odf",
  "odf.opendocument",
  "odf.text",
  "odf.table",
  "odf.draw",
  "odf.teletype",
  "striprtf",
  "striprtf.striprtf",
  "xlrd",
  "olefile",
  "PIL",
  "PIL.ExifTags",
  "pytesseract",
  "fitz",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy"]
ignore_missing_imports = true
